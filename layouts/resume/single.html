{{- define "main" }}
<a class="resume-skip-link" href="#main-content">Skip to content</a>

<nav class="resume-toolbar" aria-label="Resume actions">
  {{- with .Params.alternateResumeURL }}
  <a class="resume-language" href="{{ . | relURL }}" aria-label="Open the {{ $.Params.alternateResumeLabel }} resume">{{ $.Params.alternateResumeLabel }}</a>
  {{- end }}
  <button class="resume-print" id="resume-print" type="button" aria-label="Export resume as PDF">PDF</button>
</nav>

<article class="resume-paper{{ if eq .Params.resumeLanguage "en" }} resume-paper-en{{ else }} resume-paper-zh{{ end }}" id="main-content">
  <header class="resume-heading">
    <h1>{{ .Title }}</h1>
    <div class="resume-contact" aria-label="Contact links">
      <a href="mailto:chengyongru.ai@gmail.com">chengyongru.ai@gmail.com</a>
      <span class="resume-contact-separator" aria-hidden="true">|</span>
      <a href="https://github.com/chengyongru">github.com/chengyongru</a>
    </div>
  </header>

  <div class="resume-content">
    {{ .Content }}
  </div>
</article>

<script>
  document.getElementById("resume-print").addEventListener("click", () => window.print());
</script>
{{- end }}
