<!doctype html>
<html lang="{{ .Params.resumeLanguage | default site.Language.LanguageCode | default "en" }}" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>{{ .Title }} | {{ site.Title }}</title>
  <style>
    @font-face {
      font-family: "Nothing You Could Do";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("/fonts/nothing-you-could-do-latin.woff2") format("woff2");
    }

    :root {
      --theme: #fff;
      --primary: #1e1e1e;
      --secondary: #6c6c6c;
      --surface: #f5f5f5;
      --border: #eee;
      color-scheme: light;
    }

    :root[data-theme="dark"] {
      --theme: #1d1e20;
      --primary: #dadadb;
      --secondary: #9b9c9d;
      --surface: #2e2e33;
      --border: #333;
      color-scheme: dark;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      scrollbar-color: var(--border) transparent;
      scrollbar-width: thin;
    }

    body {
      margin: 0;
      color: var(--primary);
      background: var(--theme);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      font-size: 16px;
      line-height: 1.55;
    }

    a { color: inherit; text-underline-offset: 0.22em; }
    button { color: inherit; font: inherit; }

    .resume-site-header {
      min-height: 60px;
      padding: 0 24px;
    }

    .resume-nav {
      display: flex;
      align-items: center;
      gap: 24px;
      max-width: 1024px;
      min-height: 60px;
      margin: 0 auto;
    }

    .resume-logo {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 0.55rem;
    }

    .resume-brand {
      flex: 0 0 auto;
      font-family: "Nothing You Could Do", cursive;
      font-size: 24px;
      text-decoration: none;
    }

    .resume-menu {
      display: flex;
      gap: 24px;
      margin: 0 0 0 auto;
      padding: 0;
      list-style: none;
      overflow-x: auto;
      white-space: nowrap;
    }

    .resume-menu a {
      font-size: 16px;
      text-decoration: none;
    }

    .resume-menu a[aria-current="page"] {
      font-weight: 500;
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 0.3rem;
    }

    .resume-theme-toggle,
    .resume-language,
    .resume-print {
      display: inline-grid;
      min-width: 40px;
      min-height: 40px;
      padding: 0;
      place-items: center;
      color: var(--secondary);
      background: transparent;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    .resume-theme-toggle { flex: 0 0 40px; }

    .resume-theme-toggle:hover,
    .resume-language:hover,
    .resume-print:hover {
      color: var(--primary);
      background: var(--surface);
    }

    .resume-theme-toggle:focus-visible,
    .resume-language:focus-visible,
    .resume-print:focus-visible,
    a:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 3px;
    }

    .resume-main {
      width: min(100% - 48px, 800px);
      margin: 48px auto 96px;
    }

    .resume-heading {
      display: flex;
      align-items: flex-start;
      gap: 24px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border);
    }

    .resume-heading-copy { min-width: 0; }

    .resume-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 4px;
      margin-left: auto;
    }

    .resume-language {
      min-width: 40px;
      min-height: 40px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-decoration: none;
    }

    .resume-kicker {
      margin: 0 0 8px;
      color: var(--secondary);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .resume-heading h1 {
      margin: 0;
      font-size: clamp(2.25rem, 7vw, 4rem);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .resume-description {
      max-width: 42rem;
      margin: 14px 0 0;
      color: var(--secondary);
      font-size: 1.05rem;
    }

    .resume-print {
      flex: 0 0 auto;
      margin-left: auto;
    }

    .resume-content { margin-top: 32px; }

    .resume-content h2 {
      margin: 36px 0 14px;
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .resume-content h3 {
      margin: 24px 0 4px;
      font-size: 1.06rem;
    }

    .resume-content h3 + p {
      margin-top: 0;
      color: var(--secondary);
      font-size: 0.92rem;
    }

    .resume-entry-header p { margin-bottom: 0; }

    .resume-content p { margin: 10px 0; }

    .resume-content ul {
      margin: 10px 0;
      padding-left: 1.15rem;
    }

    .resume-content li { margin: 5px 0; }

    .resume-skills {
      margin: 10px 0 0;
    }

    .resume-skills div {
      display: grid;
      grid-template-columns: 8.5rem minmax(0, 1fr);
      gap: 0.6rem;
      margin: 5px 0;
    }

    .resume-skills dt { font-weight: 600; }
    .resume-skills dd { margin: 0; }

    .resume-contact {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 18px;
      margin-bottom: 28px;
      color: var(--secondary);
      font-size: 0.92rem;
    }

    .resume-contact a { text-decoration-style: dotted; }

    @media (max-width: 720px) {
      .resume-nav {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 40px;
        gap: 0 8px;
      }

      .resume-menu {
        grid-column: 1 / -1;
        grid-row: 2;
        width: 100%;
        margin: 0;
        padding-bottom: 10px;
      }

      .resume-theme-toggle {
        grid-column: 2;
        grid-row: 1;
      }

      .resume-main {
        width: min(100% - 32px, 800px);
        margin-top: 40px;
      }

      .resume-heading { gap: 12px; }

      .resume-actions { gap: 0; }

      .resume-skills div {
        grid-template-columns: 1fr;
        gap: 0;
      }
    }

    @media print {
      @page { size: A4; margin: 0; }

      :root,
      :root[data-theme="dark"] {
        --theme: #fff;
        --primary: #111;
        --secondary: #4d4d4d;
        --border: #ddd;
        color-scheme: light;
      }

      body {
        font-size: 10pt;
        line-height: 1.38;
        background: #fff;
      }

      .resume-site-header,
      .resume-actions { display: none !important; }

      .resume-main {
        width: 100%;
        margin: 0;
        padding: 11mm 15mm;
      }

      .resume-heading { padding-bottom: 11pt; }
      .resume-heading h1 { font-size: 27pt; }
      .resume-description { margin-top: 5pt; font-size: 10.5pt; }
      .resume-content { margin-top: 12pt; }
      .resume-contact { margin-bottom: 14pt; }
      .resume-content h2 { margin: 14pt 0 5pt; }
      .resume-content h3 { margin-top: 9pt; }
      .resume-entry-header p { margin-top: 2pt; }
      .resume-content p,
      .resume-content ul { margin-block: 5pt; }
      .resume-content li { margin-block: 2pt; }
      .resume-skills div {
        grid-template-columns: 7.4rem minmax(0, 1fr);
        gap: 5pt;
        margin-block: 2pt;
      }
      .resume-content h2,
      .resume-content h3,
      .resume-content li { break-inside: avoid; }

      a { text-decoration: none; }
    }
  </style>
  <script>
    (() => {
      const savedTheme = localStorage.getItem("pref-theme");
      const theme = savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body>
  <header class="resume-site-header">
    <nav class="resume-nav" aria-label="Primary navigation">
      <span class="resume-logo">
        <a class="resume-brand" href="/">Cheng Yongru</a>
        <span aria-hidden="true">🤔</span>
      </span>
      <ul class="resume-menu">
        {{- range site.Menus.main }}
        <li>
          <a href="{{ .URL | relURL }}"{{ if eq .Identifier "resume" }} aria-current="page"{{ end }}>{{ .Name }}</a>
        </li>
        {{- end }}
      </ul>
      <button class="resume-theme-toggle" id="resume-theme-toggle" type="button" aria-label="Toggle theme">
        <svg class="resume-theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"></path>
        </svg>
      </button>
    </nav>
  </header>

  <main class="resume-main" id="main-content">
    <article>
      <header class="resume-heading">
        <div class="resume-heading-copy">
          <p class="resume-kicker">Resume</p>
          <h1>{{ .Title }}</h1>
          {{- with .Description }}
          <p class="resume-description">{{ . }}</p>
          {{- end }}
        </div>
        <div class="resume-actions">
          {{- with .Params.alternateResumeURL }}
          <a class="resume-language" href="{{ . | relURL }}" aria-label="Open the {{ $.Params.alternateResumeLabel }} resume">{{ $.Params.alternateResumeLabel }}</a>
          {{- end }}
          <button class="resume-print" id="resume-print" type="button" aria-label="Export resume as PDF">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3v12"></path>
              <path d="m7 10 5 5 5-5"></path>
              <path d="M5 21h14"></path>
            </svg>
          </button>
        </div>
      </header>
      <div class="resume-content">
        {{ .Content }}
      </div>
    </article>
  </main>

  <script>
    document.getElementById("resume-print").addEventListener("click", () => window.print());
    document.getElementById("resume-theme-toggle").addEventListener("click", () => {
      const root = document.documentElement;
      const nextTheme = root.dataset.theme === "dark" ? "light" : "dark";
      root.dataset.theme = nextTheme;
      localStorage.setItem("pref-theme", nextTheme);
    });
  </script>
</body>
</html>
