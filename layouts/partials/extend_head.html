{{- if .Params.math -}}
  <link rel="stylesheet" href="{{ "vendor/katex/katex.min.css" | relURL }}">
{{- end -}}
{{- if .Params.mermaid -}}
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.14.0/dist/mermaid.esm.min.mjs';
    const dark = document.documentElement.dataset.theme === 'dark' ||
      (localStorage.getItem('pref-theme') !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    mermaid.initialize({ startOnLoad: true, theme: dark ? 'dark' : 'neutral' });
  </script>
{{- end -}}
