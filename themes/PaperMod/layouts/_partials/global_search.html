{{- $searchPage := site.GetPage "/search" -}}
<div id="global-search" class="global-search-outer" aria-hidden="true">
    <section class="global-search-dialog" role="dialog" aria-modal="true" aria-labelledby="search-dialog-title">
        <header class="search-dialog-header">
            <h2 id="search-dialog-title">Search</h2>
            <button id="search-close" class="search-close" type="button" aria-label="Close search">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                    stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                    <path d="M6 6l12 12M18 6L6 18"></path>
                </svg>
            </button>
        </header>
        <div id="searchbox" class="searchbox">
            <label class="search-label" for="searchInput">Search titles and content</label>
            <div class="search-field">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                    stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="m16 16 4 4"></path>
                </svg>
                <input id="searchInput"
                    placeholder="{{ $searchPage.Params.placeholder | default "Search titles and content" }}"
                    type="search" autocomplete="off" maxlength="64" aria-describedby="search-status">
                <button id="search-clear" class="search-clear" type="button" aria-label="Clear search">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                        stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                        <path d="M7 7l10 10M17 7 7 17"></path>
                    </svg>
                </button>
            </div>
            <div id="search-status" class="search-status" role="status" aria-live="polite"></div>
            <ul id="searchResults" class="searchResults" aria-label="Search results"></ul>
        </div>
    </section>
</div>
